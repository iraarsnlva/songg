<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">

    <!-- Bootstrap5 CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.0.0-alpha1/css/bootstrap.min.css" integrity="sha384-r4NyP46KrjDleawBgD5tp8Y7UzmLA05oM1iAEQ17CSuDqnUK2+k9luXQOfXJCJ4I" crossorigin="anonymous">
    
    <title>Daftar</title>
</head>
<body class="d-flex text-center">
    <form class="form-register" id="registerForm">

        <h1 class="h3 mb-3 font-weight-normal">Daftar</h1>
        <!-- 'sr-only' will hide the text : 'Email Address'. So, 'Email Address' will be invisible -->
        <label for="inputUsername" class="sr-only">Username</label>
        <!-- 'autofocus' will highlight the input column initially -->
        <input 
            type="username" 
            id="username"
            class="form-control mb-2"
            placeholder="Username"
            required
            autofocus
        >
        <!-- 'sr-only' will hide the text : 'Password'. So, 'Password' will be invisible -->
        <label for="inputPassword" class="sr-only">Password</label>
        <input 
            type="password" 
            id="password"
            class="form-control mb-2"
            placeholder="Password"
            required
        >

        <label for="inputEmail" class="sr-only">Email</label>
        <!-- 'autofocus' will highlight the input column initially -->
        <input 
            type="email" 
            id="email"
            class="form-control mb-2"
            placeholder="Email"
            required
            autofocus
        >
        <!-- 'btn-block' will make the button wider -->
        <button class="btn btn-lg btn-primary btn-block" type="submit">
            Daftar
        </button>
         <a id="message"></a>
    </form>

    <!-- Optional JavaScript -->
    <!-- Popper.js first, then Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/5.0.0-alpha1/js/bootstrap.min.js" integrity="sha384-oesi62hOLfzrys4LxRF63OJCXdXDipiYWBnvTl9Y9/TRlw5xlKIEHpNyvvDShgf/" crossorigin="anonymous"></script>\
    <script src="js/register.js" defer></script>
</body>
</html>
